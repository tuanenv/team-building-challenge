<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Team Building Challenge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #0f172a; }
</style>
</head>
<body>
<div id="root"></div>
<div id="load-error" style="display:none; color:#f87171; font-family:sans-serif; padding:2rem; text-align:center; white-space:pre-line;"></div>

<script>
  // Defensive check: if a required library failed to load (e.g. blocked by
  // a corporate firewall/proxy), show a clear message instead of leaving
  // the page blank. This runs independently of the main app script below.
  window.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      var missing = [];
      if (typeof React === "undefined") missing.push("React (cdnjs.cloudflare.com)");
      if (typeof ReactDOM === "undefined") missing.push("ReactDOM (cdnjs.cloudflare.com)");
      if (typeof Chart === "undefined") missing.push("Chart.js (cdn.jsdelivr.net)");
      if (typeof Babel === "undefined") missing.push("Babel (unpkg.com)");
      var rootEl = document.getElementById("root");
      if (missing.length > 0 && (!rootEl || !rootEl.hasChildNodes())) {
        document.getElementById("load-error").style.display = "block";
        document.getElementById("load-error").innerText =
          "โหลดไลบรารีไม่สำเร็จ: " + missing.join(", ") +
          "\n\nเครือข่ายนี้อาจบล็อกโดเมนดังกล่าว ลองเปิดจากเครือข่ายอื่น (เช่น เน็ตมือถือ) หรือแจ้งทีม IT ให้ปลดบล็อก";
      }
    }, 3000);
  });
</script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, Fragment } = React;

/* =========================================================
   1) SET THIS to your Google Apps Script Web App URL
      (see setup instructions in Code.gs)
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzc79ZwzSfEYMjfmsD_jYcL6ofygKqOsi6UkVf7LdG-PDmx8qakQ1BSZfthhXzB8Wnr/exec";

const TEAMS = ["A", "B", "C", "D"];
const TEAM_COLORS = {
  A: { text: "text-red-600", hex: "#ef4444" },
  B: { text: "text-blue-600", hex: "#3b82f6" },
  C: { text: "text-amber-600", hex: "#f59e0b" },
  D: { text: "text-emerald-600", hex: "#10b981" },
};

const SPORTS = [
  { id: "hado", name: "HADO", emoji: "⚡", pairs: [["A", "B"], ["C", "D"]], higherWins: true },
  { id: "basketball", name: "Mini Basketball", emoji: "🏀", pairs: [["A", "B"], ["C", "D"]], higherWins: true },
  { id: "bowling", name: "Mini Bowling", emoji: "🎳", pairs: [["A", "C"], ["B", "D"]], higherWins: true },
  { id: "archery", name: "Archery", emoji: "🏹", pairs: [["A", "C"], ["B", "D"]], higherWins: true },
  { id: "skiing", name: "I-Skiing", emoji: "⛷️", pairs: [["A", "D"], ["B", "C"]], higherWins: false },
  { id: "dance", name: "Dance Game", emoji: "💃", pairs: [["A", "D"], ["B", "C"]], higherWins: true },
];

const RANK_POINTS = { 1: 10, 2: 8, 3: 6, 4: 4 };
const EDIT_PIN = "2808";

function emptyScores() {
  const s = {};
  SPORTS.forEach((sp) => {
    s[sp.id] = { higherWins: sp.higherWins, raw: { A: null, B: null, C: null, D: null } };
  });
  return s;
}

function computeRanks(rawScores, higherWins) {
  const entries = TEAMS.map((t) => ({ team: t, value: rawScores[t] })).filter(
    (e) => e.value !== null && e.value !== undefined && e.value !== ""
  );
  if (entries.length === 0) return {};
  entries.sort((a, b) => (higherWins ? b.value - a.value : a.value - b.value));
  const ranks = {};
  let prevValue = null;
  let prevRank = 0;
  entries.forEach((e, idx) => {
    if (e.value === prevValue) {
      ranks[e.team] = prevRank;
    } else {
      ranks[e.team] = idx + 1;
      prevRank = idx + 1;
      prevValue = e.value;
    }
  });
  return ranks;
}

/* ---- Remote storage helpers (Google Apps Script backend) ---- */
async function apiGet() {
  const res = await fetch(API_URL, { method: "GET" });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "GET failed");
  return data.value; // string or null
}

async function apiSet(valueString) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
    body: JSON.stringify({ value: valueString }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "POST failed");
  return true;
}

function ScoringApp() {
  const [activeTab, setActiveTab] = useState("leaderboard");
  const [scores, setScores] = useState(emptyScores());
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [error, setError] = useState(null);
  const [isUnlocked, setIsUnlocked] = useState(false);
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [configWarning, setConfigWarning] = useState(
    API_URL.indexOf("PASTE_YOUR") === 0
  );

  const loadScores = useCallback(async () => {
    if (configWarning) { setLoading(false); return; }
    try {
      const value = await apiGet();
      if (value) {
        const parsed = JSON.parse(value);
        setScores({ ...emptyScores(), ...parsed });
      }
      setError(null);
    } catch (e) {
      setError("โหลดข้อมูลไม่สำเร็จ ตรวจสอบการเชื่อมต่อ");
    } finally {
      setLoading(false);
    }
  }, [configWarning]);

  useEffect(() => {
    loadScores();
    const interval = setInterval(loadScores, 4000);
    return () => clearInterval(interval);
  }, [loadScores]);

  const saveScores = async (newScores) => {
    setSaving(true);
    try {
      await apiSet(JSON.stringify(newScores));
      setLastSaved(new Date());
      setError(null);
    } catch (e) {
      setError("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setSaving(false);
    }
  };

  const setRawScore = (sportId, team, value) => {
    if (!isUnlocked) return;
    setScores((prev) => {
      const sportData = { ...prev[sportId] };
      const raw = { ...sportData.raw, [team]: value === "" ? null : Number(value) };
      const updated = { ...prev, [sportId]: { ...sportData, raw } };
      saveScores(updated);
      return updated;
    });
  };

  const toggleDirection = (sportId) => {
    if (!isUnlocked) return;
    setScores((prev) => {
      const sportData = { ...prev[sportId] };
      const updated = { ...prev, [sportId]: { ...sportData, higherWins: !sportData.higherWins } };
      saveScores(updated);
      return updated;
    });
  };

  const clearSport = (sportId) => {
    if (!isUnlocked) return;
    setScores((prev) => {
      const sportDef = SPORTS.find((s) => s.id === sportId);
      const updated = {
        ...prev,
        [sportId]: { higherWins: sportDef.higherWins, raw: { A: null, B: null, C: null, D: null } },
      };
      saveScores(updated);
      return updated;
    });
  };

  const sportPoints = {};
  SPORTS.forEach((sp) => {
    const sportData = scores[sp.id] || { raw: {}, higherWins: sp.higherWins };
    const ranks = computeRanks(sportData.raw, sportData.higherWins);
    const points = {};
    TEAMS.forEach((t) => {
      points[t] = ranks[t] ? RANK_POINTS[ranks[t]] || 0 : 0;
    });
    sportPoints[sp.id] = { ranks, points };
  });

  const teamTotals = TEAMS.map((team) => {
    let total = 0;
    SPORTS.forEach((sp) => {
      total += sportPoints[sp.id].points[team] || 0;
    });
    return { team, total };
  }).sort((a, b) => b.total - a.total);

  const barData = SPORTS.map((sp) => {
    const row = { name: sp.name };
    TEAMS.forEach((t) => { row[t] = sportPoints[sp.id].points[t] || 0; });
    return row;
  });

  const radarData = SPORTS.map((sp) => {
    const row = { sport: sp.name };
    TEAMS.forEach((t) => { row[t] = sportPoints[sp.id].points[t] || 0; });
    return row;
  });

  const completedSports = SPORTS.filter((sp) => {
    const raw = (scores[sp.id] || {}).raw || {};
    return TEAMS.every((t) => raw[t] !== null && raw[t] !== undefined);
  }).length;

  const handlePinSubmit = () => {
    if (pinInput === EDIT_PIN) {
      setIsUnlocked(true);
      setShowPinModal(false);
      setPinInput("");
      setPinError(false);
    } else {
      setPinError(true);
      setPinInput("");
    }
  };

  const handleLockToggle = () => {
    if (isUnlocked) {
      setIsUnlocked(false);
    } else {
      setPinInput("");
      setPinError(false);
      setShowPinModal(true);
    }
  };

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-900">
        <div className="text-white flex items-center gap-2">
          <span className="animate-spin inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>
          กำลังโหลดข้อมูล...
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-900 via-slate-900 to-slate-800 text-white">
      {configWarning && (
        <div className="bg-red-600 text-white text-xs sm:text-sm text-center py-2 px-3">
          ⚠️ ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html — กรุณาใส่ Web App URL จาก Google Apps Script (ดูคอมเมนต์ในไฟล์ Code.gs)
        </div>
      )}

      <div className="px-3 pt-4 pb-3 text-center border-b border-slate-700/50">
        <div className="flex items-center justify-center gap-2 mb-1">
          <span className="text-2xl">🏆</span>
          <h1 className="text-base sm:text-2xl font-black tracking-tight leading-tight">TEAM BUILDING CHALLENGE</h1>
        </div>
        <p className="text-slate-400 text-xs sm:text-sm">Central Northville · 4 Teams · 6 Sports</p>
        <div className="mt-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[11px] sm:text-xs text-slate-400">
          <span>{completedSports}/6 กีฬาบันทึกแล้ว</span>
          <span className="flex items-center gap-1">
            {saving ? (
              <>
                <span className="animate-spin inline-block w-3 h-3 border-2 border-slate-400 border-t-transparent rounded-full"></span>
                กำลังบันทึก...
              </>
            ) : lastSaved ? (
              <>✓ อัพเดต {lastSaved.toLocaleTimeString("th-TH")}</>
            ) : null}
          </span>
        </div>
        {error && <p className="text-red-400 text-xs mt-1">{error}</p>}

        <button
          onClick={handleLockToggle}
          className={`mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${
            isUnlocked
              ? "bg-emerald-500/15 text-emerald-400 ring-1 ring-emerald-500/40"
              : "bg-slate-800 text-slate-300 ring-1 ring-slate-700"
          }`}
        >
          {isUnlocked ? "🔓 โหมดแก้ไข (แตะเพื่อล็อก)" : "🔒 ดูอย่างเดียว · แตะเพื่อปลดล็อก"}
        </button>
      </div>

      <div className="sticky top-0 bg-slate-900/95 backdrop-blur z-10 border-b border-slate-700/50">
        <div className="px-3 pt-3 pb-2">
          <button
            onClick={() => setActiveTab("leaderboard")}
            className={`w-full flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-bold transition-colors ${
              activeTab === "leaderboard"
                ? "bg-amber-500 text-slate-900"
                : "bg-slate-800 text-slate-300 active:bg-slate-700"
            }`}
          >
            🏆 สรุปผล
          </button>
        </div>
        <div className="grid grid-cols-3 gap-1.5 px-3 pb-3">
          {SPORTS.map((sp) => (
            <TabButton key={sp.id} active={activeTab === sp.id} onClick={() => setActiveTab(sp.id)}>
              <span className="block text-base leading-tight">{sp.emoji}</span>
              <span className="block text-[11px] leading-tight">{sp.name}</span>
            </TabButton>
          ))}
        </div>
      </div>

      <div className="p-3 sm:p-4">
        {activeTab === "leaderboard" ? (
          <Leaderboard teamTotals={teamTotals} barData={barData} radarData={radarData} />
        ) : (
          <SportEntry
            sport={SPORTS.find((s) => s.id === activeTab)}
            sportData={scores[activeTab]}
            pointsInfo={sportPoints[activeTab]}
            onSetRawScore={setRawScore}
            onToggleDirection={toggleDirection}
            onClear={clearSport}
            isUnlocked={isUnlocked}
            onRequestUnlock={handleLockToggle}
          />
        )}
      </div>

      {showPinModal && (
        <div
          className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
          onClick={() => setShowPinModal(false)}
        >
          <div className="bg-slate-800 rounded-2xl p-5 w-full max-w-xs" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-base font-bold flex items-center gap-2">🔒 ใส่ PIN เพื่อแก้ไข</h3>
              <button onClick={() => setShowPinModal(false)} className="text-slate-400 hover:text-white text-lg leading-none">✕</button>
            </div>
            <input
              type="password"
              inputMode="numeric"
              maxLength={4}
              autoFocus
              value={pinInput}
              onChange={(e) => {
                setPinInput(e.target.value.replace(/\D/g, "").slice(0, 4));
                setPinError(false);
              }}
              onKeyDown={(e) => e.key === "Enter" && handlePinSubmit()}
              placeholder="••••"
              className="w-full text-center text-2xl tracking-[0.5em] font-bold py-3 rounded-lg bg-slate-700 text-white border border-slate-600 focus:border-amber-400 focus:outline-none"
            />
            {pinError && <p className="text-red-400 text-xs mt-2 text-center">PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง</p>}
            <button
              onClick={handlePinSubmit}
              className="w-full mt-4 py-2.5 rounded-lg bg-amber-500 text-slate-900 font-bold text-sm active:bg-amber-600"
            >
              ปลดล็อก
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function TabButton({ active, onClick, children }) {
  return (
    <button
      onClick={onClick}
      className={`flex flex-col items-center justify-center gap-0.5 px-1 py-2 rounded-lg font-semibold transition-colors ${
        active ? "bg-amber-500 text-slate-900" : "bg-slate-800 text-slate-300 active:bg-slate-700"
      }`}
    >
      {children}
    </button>
  );
}

function SportEntry({ sport, sportData, pointsInfo, onSetRawScore, onToggleDirection, onClear, isUnlocked, onRequestUnlock }) {
  const raw = sportData?.raw || {};
  const higherWins = sportData?.higherWins ?? sport.higherWins;
  const ranks = pointsInfo?.ranks || {};
  const points = pointsInfo?.points || {};

  return (
    <div>
      {!isUnlocked && (
        <button
          onClick={onRequestUnlock}
          className="w-full mb-3 flex items-center justify-center gap-2 py-2.5 rounded-lg bg-amber-500/10 text-amber-400 ring-1 ring-amber-500/30 text-sm font-semibold"
        >
          🔒 โหมดดูอย่างเดียว · แตะเพื่อใส่ PIN แก้ไข
        </button>
      )}

      <div className="flex items-center justify-between mb-3">
        <h2 className="text-lg font-bold flex items-center gap-2">
          <span className="text-2xl">{sport.emoji}</span> {sport.name}
        </h2>
        <button
          onClick={() => (isUnlocked ? onClear(sport.id) : onRequestUnlock())}
          disabled={!isUnlocked}
          className={`text-xs underline ${isUnlocked ? "text-slate-400 hover:text-red-400" : "text-slate-600 cursor-not-allowed"}`}
        >
          ล้างคะแนน
        </button>
      </div>

      <button
        onClick={() => (isUnlocked ? onToggleDirection(sport.id) : onRequestUnlock())}
        disabled={!isUnlocked}
        className={`w-full mb-4 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-medium ${
          isUnlocked ? "bg-slate-800 hover:bg-slate-700 text-slate-200" : "bg-slate-800/50 text-slate-500 cursor-not-allowed"
        }`}
      >
        {higherWins ? "▲ คะแนนสูงชนะ" : "▼ คะแนนต่ำชนะ (เช่น เวลา)"}
        {isUnlocked && <span className="text-slate-500">· แตะเพื่อสลับ</span>}
      </button>

      <div className="space-y-3 mb-4">
        {sport.pairs.map((pair, idx) => (
          <div key={idx} className="bg-slate-800/60 rounded-xl p-3">
            <p className="text-xs text-slate-400 mb-2">แมตช์ {idx + 1}</p>
            <div className="flex items-center gap-2">
              {pair.map((team, i) => (
                <Fragment key={team}>
                  <RawScoreInput
                    team={team}
                    value={raw[team]}
                    onChange={(v) => onSetRawScore(sport.id, team, v)}
                    disabled={!isUnlocked}
                  />
                  {i === 0 && <span className="text-slate-500 font-bold text-xs shrink-0">VS</span>}
                </Fragment>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="bg-slate-800/60 rounded-xl p-3">
        <p className="text-xs text-slate-400 mb-2">อันดับปัจจุบันของกีฬานี้</p>
        <div className="grid grid-cols-4 gap-2">
          {TEAMS.map((team) => {
            const colors = TEAM_COLORS[team];
            const rank = ranks[team];
            const pts = points[team] || 0;
            return (
              <div key={team} className={`rounded-lg p-2 text-center ${rank ? "bg-slate-700" : "bg-slate-800 opacity-50"}`}>
                <div className={`text-xs font-bold ${colors.text}`}>ทีม {team}</div>
                <div className="text-lg font-black text-white">{rank ? `#${rank}` : "-"}</div>
                <div className="text-xs text-slate-400">{pts} pt</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function RawScoreInput({ team, value, onChange, disabled }) {
  const colors = TEAM_COLORS[team];
  return (
    <div className="flex-1">
      <label className={`block text-xs font-bold mb-1 ${colors.text}`}>ทีม {team}</label>
      <input
        type="number"
        inputMode="decimal"
        value={value === null || value === undefined ? "" : value}
        onChange={(e) => onChange(e.target.value)}
        placeholder="0"
        disabled={disabled}
        className={`w-full text-center text-lg font-bold py-2 rounded-lg border focus:outline-none ${
          disabled
            ? "bg-slate-800/60 text-slate-500 border-slate-700 cursor-not-allowed"
            : "bg-slate-700 text-white border-slate-600 focus:border-amber-400"
        }`}
      />
    </div>
  );
}

function BarChartCanvas({ barData }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [chartLibReady, setChartLibReady] = useState(typeof Chart !== "undefined");

  useEffect(() => {
    if (chartLibReady) return;
    const interval = setInterval(() => {
      if (typeof Chart !== "undefined") {
        setChartLibReady(true);
        clearInterval(interval);
      }
    }, 100);
    return () => clearInterval(interval);
  }, [chartLibReady]);

  useEffect(() => {
    if (!chartLibReady || !canvasRef.current) return;
    const labels = barData.map((row) => row.name);
    const datasets = TEAMS.map((t) => ({
      label: `ทีม ${t}`,
      data: barData.map((row) => row[t] || 0),
      backgroundColor: TEAM_COLORS[t].hex,
      borderRadius: 3,
      maxBarThickness: 22,
    }));

    if (chartRef.current) {
      chartRef.current.data.labels = labels;
      chartRef.current.data.datasets = datasets;
      chartRef.current.update();
      return;
    }

    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: { color: "#94a3b8", font: { size: 11 } },
            grid: { color: "#334155" },
          },
          y: {
            beginAtZero: true,
            max: 10,
            ticks: { color: "#94a3b8", font: { size: 11 } },
            grid: { color: "#334155" },
          },
        },
        plugins: {
          legend: { labels: { color: "#e2e8f0", font: { size: 12 } } },
          tooltip: {
            backgroundColor: "#1e293b",
            borderColor: "#334155",
            borderWidth: 1,
            titleColor: "#e2e8f0",
            bodyColor: "#e2e8f0",
          },
        },
      },
    });

    return () => {
      if (chartRef.current) {
        chartRef.current.destroy();
        chartRef.current = null;
      }
    };
  }, [barData, chartLibReady]);

  if (!chartLibReady) {
    return (
      <div className="h-full flex items-center justify-center text-slate-500 text-sm">
        กำลังโหลดกราฟ...
      </div>
    );
  }

  return <canvas ref={canvasRef} height={280}></canvas>;
}

function RadarChartCanvas({ radarData }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [chartLibReady, setChartLibReady] = useState(typeof Chart !== "undefined");

  useEffect(() => {
    if (chartLibReady) return;
    const interval = setInterval(() => {
      if (typeof Chart !== "undefined") {
        setChartLibReady(true);
        clearInterval(interval);
      }
    }, 100);
    return () => clearInterval(interval);
  }, [chartLibReady]);

  useEffect(() => {
    if (!chartLibReady || !canvasRef.current) return;
    const labels = radarData.map((row) => row.sport);
    const datasets = TEAMS.map((t) => ({
      label: `ทีม ${t}`,
      data: radarData.map((row) => row[t] || 0),
      borderColor: TEAM_COLORS[t].hex,
      backgroundColor: TEAM_COLORS[t].hex + "26",
      pointBackgroundColor: TEAM_COLORS[t].hex,
      borderWidth: 2,
    }));

    if (chartRef.current) {
      chartRef.current.data.labels = labels;
      chartRef.current.data.datasets = datasets;
      chartRef.current.update();
      return;
    }

    chartRef.current = new Chart(canvasRef.current, {
      type: "radar",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            beginAtZero: true,
            max: 10,
            angleLines: { color: "#334155" },
            grid: { color: "#334155" },
            pointLabels: { color: "#94a3b8", font: { size: 10 } },
            ticks: { color: "#64748b", backdropColor: "transparent", font: { size: 9 } },
          },
        },
        plugins: {
          legend: { labels: { color: "#e2e8f0", font: { size: 12 } } },
        },
      },
    });

    return () => {
      if (chartRef.current) {
        chartRef.current.destroy();
        chartRef.current = null;
      }
    };
  }, [radarData, chartLibReady]);

  if (!chartLibReady) {
    return (
      <div className="h-full flex items-center justify-center text-slate-500 text-sm">
        กำลังโหลดกราฟ...
      </div>
    );
  }

  return <canvas ref={canvasRef} height={280}></canvas>;
}

function Leaderboard({ teamTotals, barData, radarData }) {
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {teamTotals.map((t, idx) => {
          const colors = TEAM_COLORS[t.team];
          return (
            <div
              key={t.team}
              className={`rounded-xl p-4 relative overflow-hidden ${
                idx === 0 ? "bg-gradient-to-br from-amber-500/20 to-slate-800 ring-1 ring-amber-400/50" : "bg-slate-800/60"
              }`}
            >
              {idx === 0 && <span className="absolute top-2 right-2 text-amber-400 text-base">🏆</span>}
              <div className="text-xs text-slate-400 mb-1">อันดับ {idx + 1}</div>
              <div className={`text-2xl font-black mb-1 ${colors.text}`}>ทีม {t.team}</div>
              <div className="text-3xl font-black text-white">{t.total}</div>
              <div className="text-xs text-slate-400">คะแนน</div>
            </div>
          );
        })}
      </div>

      <div className="bg-slate-800/60 rounded-xl p-3 sm:p-4">
        <h3 className="text-sm font-semibold text-slate-300 mb-3">คะแนนแยกตามกีฬา</h3>
        <div style={{ position: "relative", height: 280 }}>
          <BarChartCanvas barData={barData} />
        </div>
      </div>

      <div className="bg-slate-800/60 rounded-xl p-3 sm:p-4">
        <h3 className="text-sm font-semibold text-slate-300 mb-3">ภาพรวมความแข็งแกร่งแต่ละทีม</h3>
        <div style={{ position: "relative", height: 280 }}>
          <RadarChartCanvas radarData={radarData} />
        </div>
      </div>

      <p className="text-center text-xs text-slate-500">
        ระบบให้คะแนน: อันดับ 1 = 10 · อันดับ 2 = 8 · อันดับ 3 = 6 · อันดับ 4 = 4 คะแนน
      </p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ScoringApp />);
</script>
</body>
</html>
